<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one lamplit room as the hero, staff cards underneath. Single evening-office world, one theme by choice. */
:root {
  color-scheme: dark;
  --room: #231925;
  --panel: #2f2231;
  --line: #5b445c;
  --ink: #f4e9dc;
  --muted: #bda9ac;
  --lamp: #ffc66b;
  --work: #ffb347;
  --rest: #8fd0c4;
  --moss: #7fae6b;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--room);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; margin: 0; letter-spacing: 0.02em; color: var(--lamp); }
.clock { font-family: var(--font-display); font-size: 1.05rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.clock b { color: var(--ink); font-weight: 500; }

.scene { border: 3px solid var(--line); border-radius: 10px; overflow: hidden; background: #3b2a3a; }
.scene svg { display: block; width: 100%; height: auto; shape-rendering: crispEdges; }

.note { color: var(--muted); font-size: 0.9rem; margin: 0; max-width: 65ch; }

.staff { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card.empty { border-style: dashed; }
.card h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.35rem; margin: 0; }
.role { color: var(--muted); margin: 0; font-size: 0.95rem; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pill { font-family: var(--font-display); font-size: 0.9rem; padding: 2px 10px; border-radius: 999px; border: 2px solid currentColor; white-space: nowrap; }
.pill.work { color: var(--work); }
.pill.rest { color: var(--rest); }
.pill.soon { color: var(--muted); }
.now { margin: 0; font-size: 1.05rem; }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.92rem; }
dt { color: var(--muted); }
dd { margin: 0; font-variant-numeric: tabular-nums; }
button {
  font-family: var(--font-display); font-size: 0.95rem; color: var(--room); background: var(--lamp);
  border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; align-self: flex-start;
}
button:hover { filter: brightness(1.08); }
button:focus-visible { outline: 3px solid var(--rest); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--rest); }

/* scene animation */
.hide { display: none; }
.tap-l { animation: tap 0.35s steps(2) infinite; }
.tap-r { animation: tap 0.35s steps(2) infinite 0.17s; }
@keyframes tap { 50% { transform: translateY(1.5px); } }
.scroll { animation: scroll 1.2s steps(4) infinite; }
@keyframes scroll { to { transform: translateY(-4px); } }
.mail { animation: mail 2.4s linear infinite; opacity: 0; }
.mail.m2 { animation-delay: 1.2s; }
@keyframes mail { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(-22px,-26px); opacity: 0; } }
.blink { animation: blink 0.8s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.steam { animation: steam 2.2s ease-in-out infinite; }
@keyframes steam { 0% { transform: translateY(0); opacity: 0.8; } 100% { transform: translateY(-7px); opacity: 0; } }
.zz { animation: zz 2.6s linear infinite; font-family: var(--font-display); }
.zz.z2 { animation-delay: 1.3s; }
@keyframes zz { 0% { transform: translate(0,0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(8px,-14px); opacity: 0; } }
.twinkle { animation: blink 2.4s steps(2) infinite; }
.twinkle.t2 { animation-delay: 1.2s; }
.breathe { animation: breathe 3s ease-in-out infinite; transform-origin: 215px 170px; }
@keyframes breathe { 50% { transform: scaleY(1.08); } }
@media (prefers-reduced-motion: reduce) {
  .tap-l, .tap-r, .scroll, .mail, .blink, .steam, .zz, .twinkle, .breathe { animation: none; }
  .mail, .zz { opacity: 1; }
}
</style>
</head>
<body>

  <p class="note">Each agent's status follows its schedule in Eastern time. It shows when a run is due, not a live feed from the run itself. The window shows the real time of day.</p>

<script>
// ---- Edit this list to add agents or change their personalities ----
const AGENTS = [
  {
    id: "email",
    name: "Scout",
    title: "Daily email summary",
    role: "Reads the day's inbox and reports work and business email first, Indeed suggestions briefly.",
    run: { hour: 20, minute: 42, lengthMin: 8 },   // every day, Eastern time
    scheduleText: "Every day at 8:42 PM ET",
    working: "At the desk, sorting today's inbox into work, Indeed and noise.",
    downtime: {
      tea:  "Off the clock with a cup of tea on the beanbag.",
      game: "Off the clock, playing a handheld game on the beanbag.",
      nap:  "Asleep on the beanbag until the next shift."
    },
    traits: { "Work style": "Sorts fast, flags anything time-sensitive first", "Downtime": "Handheld games, tea in the morning, early to bed" }
  }
];
const COMING_SOON = [
  { name: "Education agent", role: "Will help with projects you describe and pull resources for them. Desk is reserved." }
];
// --------------------------------------------------------------------

let preview = false;

function etNow() {
  const parts = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hourCycle: "h23", hour: "2-digit", minute: "2-digit", second: "2-digit" }).formatToParts(new Date());
  const get = t => Number(parts.find(p => p.type === t).value);
  return { h: get("hour"), m: get("minute"), s: get("second") };
}
function pad(n) { return String(n).padStart(2, "0"); }

function statusOf(agent, t) {
  const now = t.h * 60 + t.m;
  const start = agent.run.hour * 60 + agent.run.minute;
  const working = preview || (now >= start && now < start + agent.run.lengthMin);
  let until = start - now; if (until <= 0) until += 1440;
  let mode = "game";
  if (t.h >= 6 && t.h < 12) mode = "tea";
  else if (t.h >= 23 || t.h < 6) mode = "nap";
  return { working, until, mode };
}
function countdown(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  return h ? h + " h " + m + " min" : m + " min";
}
function show(id, on) { document.getElementById(id).classList.toggle("hide", !on); }

function paintSky(h) {
  const sky = document.getElementById("sky"), orb = document.getElementById("orb");
  let color = "#1d2545", night = true;
  if (h >= 6 && h < 8) { color = "#f2b28a"; night = false; }
  else if (h >= 8 && h < 17) { color = "#8ecae6"; night = false; }
  else if (h >= 17 && h < 19) { color = "#e58a6b"; night = false; }
  sky.setAttribute("fill", color);
  orb.setAttribute("fill", night ? "#f4e9dc" : "#ffe08a");
  show("stars", night);
}

function paintScene(st) {
  show("deskAgent", st.working);
  show("screenLines", st.working);
  document.getElementById("screen").setAttribute("fill", st.working ? "#8fd0c4" : "#1a1320");
  show("loungeAgent", !st.working);
  show("propGame", st.mode === "game");
  show("propTea", st.mode === "tea");
  show("propNap", st.mode === "nap");
  show("eyesOpen", st.mode !== "nap");
  show("eyesShut", st.mode === "nap");
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function buildCards() {
  const staff = document.getElementById("staff");
  AGENTS.forEach(a => {
    const card = el("article", "card");
    const top = el("div", "top");
    top.append(el("h2", null, a.name), Object.assign(el("span", "pill"), { id: "pill-" + a.id }));
    const dl = el("dl");
    const rows = Object.assign({ "Job": a.title, "Schedule": a.scheduleText }, a.traits);
    for (const k in rows) dl.append(el("dt", null, k), el("dd", null, rows[k]));
    dl.append(el("dt", null, "Next shift"), Object.assign(el("dd"), { id: "next-" + a.id }));
    const btn = el("button", null, "Preview work mode");
    btn.type = "button"; btn.id = "preview-" + a.id; btn.setAttribute("aria-pressed", "false");
    btn.addEventListener("click", () => {
      preview = !preview;
      btn.setAttribute("aria-pressed", String(preview));
      btn.textContent = preview ? "Back to real status" : "Preview work mode";
      tick();
    });
    card.append(top, el("p", "role", a.role), Object.assign(el("p", "now"), { id: "now-" + a.id }), dl, btn);
    staff.append(card);
  });
  COMING_SOON.forEach(c => {
    const card = el("article", "card empty");
    const top = el("div", "top");
    top.append(el("h2", null, c.name), el("span", "pill soon", "Moving in soon"));
    card.append(top, el("p", "role", c.role));
    staff.append(card);
  });
}

function tick() {
  const t = etNow();
  document.getElementById("clock").textContent = pad(t.h) + ":" + pad(t.m);
  paintSky(t.h);
  AGENTS.forEach(a => {
    const st = statusOf(a, t);
    if (a.id === "email") paintScene(st);
    const pill = document.getElementById("pill-" + a.id);
    pill.className = "pill " + (st.working ? "work" : "rest");
    pill.textContent = st.working ? (preview ? "Working (preview)" : "Working") : "Off the clock";
    document.getElementById("now-" + a.id).textContent = st.working ? a.working : a.downtime[st.mode];
    document.getElementById("next-" + a.id).textContent = "in " + countdown(st.until);
  });
}

buildCards();
tick();
setInterval(tick, 15000);
</script>
</body>
</html>
